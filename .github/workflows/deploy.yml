name: Deploy private ledger app

on:
  push:
      branches:
            - main
                  - master
                    workflow_dispatch:

                    permissions:
                      contents: read
                        pages: write
                          id-token: write

                          concurrency:
                            group: github-pages
                              cancel-in-progress: true

                              jobs:
                                deploy:
                                    environment:
                                          name: github-pages
                                                url: ${{ steps.deployment.outputs.page_url }}
                                                    runs-on: ubuntu-latest
                                                        steps:
                                                              - name: Check out app files
                                                                      uses: actions/checkout@v4

                                                                            - name: Prepare app-only site
                                                                                    run: |
                                                                                              mkdir site
                                                                                                        cp index.html styles.css script.js supabase-config.js site/
                                                                                                        
                                                                                                              - name: Configure GitHub Pages
                                                                                                                      uses: actions/configure-pages@v5
                                                                                                                      
                                                                                                                            - name: Upload app-only site
                                                                                                                                    uses: actions/upload-pages-artifact@v3
                                                                                                                                            with:
                                                                                                                                                      path: site
                                                                                                                                                      
                                                                                                                                                            - name: Deploy to GitHub Pages
                                                                                                                                                                    id: deployment
                                                                                                                                                                            uses: actions/deploy-pages@v4
